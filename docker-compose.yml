services:
  api:
    build: ./api
    container_name: docker-api-template
    restart: unless-stopped
    networks:
      - proxy
      - database
    expose:
      - "3102"

  app:
    build: ./app
    container_name: docker-app-template
    restart: unless-stopped
    networks:
      - proxy
    expose:
      - "80"

networks:
  proxy:
    external: true
  database:
    external: true
